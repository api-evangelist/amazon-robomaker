security:
- hmac: []
tags:
- name: CreateRobot
paths:
  /createRobot:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      deprecated: true
      operationId: CreateRobot
      description: <p>Creates a robot.</p> <important> <p>This API is no longer supported and will throw an error if used.</p> </important>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRobotResponse'
        '480':
          description: InvalidParameterException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterException'
        '481':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: LimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededException'
        '484':
          description: ResourceAlreadyExistsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAlreadyExistsException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - architecture
              - greengrassGroupId
              properties:
                name:
                  description: The name for the robot.
                  type: string
                  pattern: '[a-zA-Z0-9_\-]*'
                  minLength: 1
                  maxLength: 255
                architecture:
                  description: The target architecture of the robot.
                  type: string
                  enum:
                  - X86_64
                  - ARM64
                  - ARMHF
                greengrassGroupId:
                  description: The Greengrass group id.
                  type: string
                  pattern: .*
                  minLength: 1
                  maxLength: 1224
                tags:
                  description: A map that contains tag keys and tag values that are attached to the robot.
                  type: object
                  minProperties: 0
                  maxProperties: 50
                  additionalProperties:
                    $ref: '#/components/schemas/TagValue'
      tags:
      - CreateRobot
components:
  schemas:
    InternalServerException: {}
    InvalidParameterException: {}
    Name:
      type: string
      pattern: '[a-zA-Z0-9_\-]*'
      minLength: 1
      maxLength: 255
    TagValue:
      type: string
      pattern: '[a-zA-Z0-9 _.\-\/+=:]*'
      minLength: 0
      maxLength: 256
    CreatedAt:
      type: string
      format: date-time
    Arn:
      type: string
      pattern: arn:.*
      minLength: 1
      maxLength: 1224
    LimitExceededException: {}
    ThrottlingException: {}
    CreateRobotResponse:
      type: object
      deprecated: true
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/Arn'
          - description: The Amazon Resource Name (ARN) of the robot.
        name:
          allOf:
          - $ref: '#/components/schemas/Name'
          - description: The name of the robot.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/CreatedAt'
          - description: The time, in milliseconds since the epoch, when the robot was created.
        greengrassGroupId:
          allOf:
          - $ref: '#/components/schemas/Id'
          - description: The Amazon Resource Name (ARN) of the Greengrass group associated with the robot.
        architecture:
          allOf:
          - $ref: '#/components/schemas/Architecture'
          - description: The target architecture of the robot.
        tags:
          allOf:
          - $ref: '#/components/schemas/TagMap'
          - description: The list of all tags added to the robot.
      description: AWS RoboMaker is unable to process this request as the support for the AWS RoboMaker application deployment feature has ended. For additional information, see https://docs.aws.amazon.com/robomaker/latest/dg/fleets.html.
    Architecture:
      type: string
      enum:
      - X86_64
      - ARM64
      - ARMHF
    TagMap:
      type: object
      minProperties: 0
      maxProperties: 50
      additionalProperties:
        $ref: '#/components/schemas/TagValue'
    ResourceAlreadyExistsException: {}
    Id:
      type: string
      pattern: .*
      minLength: 1
      maxLength: 1224
  parameters:
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4

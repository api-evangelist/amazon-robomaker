security:
- hmac: []
tags:
- name: CreateRobotApplication
paths:
  /createRobotApplication:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreateRobotApplication
      description: 'Creates a robot application. '
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRobotApplicationResponse'
        '480':
          description: InvalidParameterException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterException'
        '481':
          description: ResourceAlreadyExistsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAlreadyExistsException'
        '482':
          description: LimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededException'
        '483':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '484':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '485':
          description: IdempotentParameterMismatchException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotentParameterMismatchException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - robotSoftwareSuite
              properties:
                name:
                  description: The name of the robot application.
                  type: string
                  pattern: '[a-zA-Z0-9_\-]*'
                  minLength: 1
                  maxLength: 255
                sources:
                  description: The sources of the robot application.
                  type: array
                  items:
                    $ref: '#/components/schemas/SourceConfig'
                robotSoftwareSuite:
                  description: Information about a robot software suite (ROS distribution).
                  type: object
                  properties:
                    name:
                      allOf:
                      - $ref: '#/components/schemas/RobotSoftwareSuiteType'
                      - description: The name of the robot software suite (ROS distribution).
                    version:
                      allOf:
                      - $ref: '#/components/schemas/RobotSoftwareSuiteVersionType'
                      - description: The version of the robot software suite (ROS distribution).
                tags:
                  description: A map that contains tag keys and tag values that are attached to the robot application.
                  type: object
                  minProperties: 0
                  maxProperties: 50
                  additionalProperties:
                    $ref: '#/components/schemas/TagValue'
                environment:
                  description: The object that contains the Docker image URI for either your robot or simulation applications.
                  type: object
                  properties:
                    uri:
                      allOf:
                      - $ref: '#/components/schemas/RepositoryUrl'
                      - description: The Docker image URI for either your robot or simulation applications.
      tags:
      - CreateRobotApplication
components:
  schemas:
    RobotSoftwareSuiteVersionType:
      type: string
      enum:
      - Kinetic
      - Melodic
      - Dashing
      - Foxy
    InternalServerException: {}
    Version:
      type: string
      pattern: (\$LATEST)|[0-9]*
      minLength: 1
      maxLength: 255
    RevisionId:
      type: string
      pattern: '[a-zA-Z0-9_.\-]*'
      minLength: 1
      maxLength: 40
    S3Bucket:
      type: string
      pattern: '[a-z0-9][a-z0-9.\-]*[a-z0-9]'
      minLength: 3
      maxLength: 63
    RobotSoftwareSuite:
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/RobotSoftwareSuiteType'
          - description: The name of the robot software suite (ROS distribution).
        version:
          allOf:
          - $ref: '#/components/schemas/RobotSoftwareSuiteVersionType'
          - description: The version of the robot software suite (ROS distribution).
      description: Information about a robot software suite (ROS distribution).
    Source:
      type: object
      properties:
        s3Bucket:
          allOf:
          - $ref: '#/components/schemas/S3Bucket'
          - description: The s3 bucket name.
        s3Key:
          allOf:
          - $ref: '#/components/schemas/S3Key'
          - description: The s3 object key.
        etag:
          allOf:
          - $ref: '#/components/schemas/S3Etag'
          - description: A hash of the object specified by <code>s3Bucket</code> and <code>s3Key</code>.
        architecture:
          allOf:
          - $ref: '#/components/schemas/Architecture'
          - description: The taget processor architecture for the application.
      description: Information about a source.
    RepositoryUrl:
      type: string
      pattern: .+
      minLength: 1
      maxLength: 1024
    Name:
      type: string
      pattern: '[a-zA-Z0-9_\-]*'
      minLength: 1
      maxLength: 255
    S3Key:
      type: string
      pattern: .*
      minLength: 1
      maxLength: 1024
    InvalidParameterException: {}
    IdempotentParameterMismatchException: {}
    TagValue:
      type: string
      pattern: '[a-zA-Z0-9 _.\-\/+=:]*'
      minLength: 0
      maxLength: 256
    Arn:
      type: string
      pattern: arn:.*
      minLength: 1
      maxLength: 1224
    S3Etag:
      type: string
    LastUpdatedAt:
      type: string
      format: date-time
    RobotSoftwareSuiteType:
      type: string
      enum:
      - ROS
      - ROS2
      - General
    CreateRobotApplicationResponse:
      type: object
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/Arn'
          - description: The Amazon Resource Name (ARN) of the robot application.
        name:
          allOf:
          - $ref: '#/components/schemas/Name'
          - description: The name of the robot application.
        version:
          allOf:
          - $ref: '#/components/schemas/Version'
          - description: The version of the robot application.
        sources:
          allOf:
          - $ref: '#/components/schemas/Sources'
          - description: The sources of the robot application.
        robotSoftwareSuite:
          allOf:
          - $ref: '#/components/schemas/RobotSoftwareSuite'
          - description: The robot software suite (ROS distribution) used by the robot application.
        lastUpdatedAt:
          allOf:
          - $ref: '#/components/schemas/LastUpdatedAt'
          - description: The time, in milliseconds since the epoch, when the robot application was last updated.
        revisionId:
          allOf:
          - $ref: '#/components/schemas/RevisionId'
          - description: The revision id of the robot application.
        tags:
          allOf:
          - $ref: '#/components/schemas/TagMap'
          - description: The list of all tags added to the robot application.
        environment:
          allOf:
          - $ref: '#/components/schemas/Environment'
          - description: An object that contains the Docker image URI used to a create your robot application.
    Architecture:
      type: string
      enum:
      - X86_64
      - ARM64
      - ARMHF
    ThrottlingException: {}
    LimitExceededException: {}
    TagMap:
      type: object
      minProperties: 0
      maxProperties: 50
      additionalProperties:
        $ref: '#/components/schemas/TagValue'
    SourceConfig:
      type: object
      properties:
        s3Bucket:
          allOf:
          - $ref: '#/components/schemas/S3Bucket'
          - description: The Amazon S3 bucket name.
        s3Key:
          allOf:
          - $ref: '#/components/schemas/S3Key'
          - description: The s3 object key.
        architecture:
          allOf:
          - $ref: '#/components/schemas/Architecture'
          - description: The target processor architecture for the application.
      description: Information about a source configuration.
    Environment:
      type: object
      properties:
        uri:
          allOf:
          - $ref: '#/components/schemas/RepositoryUrl'
          - description: The Docker image URI for either your robot or simulation applications.
      description: The object that contains the Docker image URI for either your robot or simulation applications.
    ResourceAlreadyExistsException: {}
    Sources:
      type: array
      items:
        $ref: '#/components/schemas/Source'
  parameters:
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/robomaker/
x-hasEquivalentPaths: true

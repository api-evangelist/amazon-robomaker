apis:
- name: AWS RoboMaker API
  description: >-
    The AWS RoboMaker API provides programmatic access to create and manage
    robotics applications, simulation jobs, and fleet deployments. It enables
    developers to build robot applications, run simulation jobs for testing,
    manage simulation worlds, and deploy applications to physical robots at
    scale.
